log4j.rootLogger=DEBUG, rolling
log4j.appender.rolling=org.apache.log4cxx.rolling.RollingFileAppender
log4j.appender.rolling.File=fuzz-rollfb.log
log4j.appender.rolling.Append=false
log4j.appender.rolling.layout=org.apache.log4j.SimpleLayout
log4j.appender.rolling.triggeringPolicy=org.apache.log4cxx.rolling.FilterBasedTriggeringPolicy
