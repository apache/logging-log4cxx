log4j.rootLogger=TRACE, console
log4j.appender.console=org.apache.log4cxx.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %c{2}:%L [%t] %Y %m %J{fuzzkey} %x %X{fuzzkey} %C %M %F %r %T %y%n
log4j.appender.console.layout.InfoColor=\u001b[32m
log4j.appender.console.layout.ErrorColor=\u001b[31m
log4j.appender.console.layout.WarnColor=\u001b[33m
