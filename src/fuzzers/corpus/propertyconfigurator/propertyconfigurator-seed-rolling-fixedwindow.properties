# Seed for PropertyConfiguratorFuzzer (Apache License 2.0; see LICENSE).
log4j.rootLogger=DEBUG, rolling
log4j.appender.rolling=org.apache.log4cxx.rolling.RollingFileAppender
log4j.appender.rolling.File=fuzz-rolling.log
log4j.appender.rolling.Append=false
log4j.appender.rolling.layout=org.apache.log4j.PatternLayout
log4j.appender.rolling.layout.ConversionPattern=%p %m%n
log4j.appender.rolling.rollingPolicy=org.apache.log4cxx.rolling.FixedWindowRollingPolicy
log4j.appender.rolling.rollingPolicy.FileNamePattern=fuzz-rolling.%i.log
log4j.appender.rolling.rollingPolicy.MinIndex=1
log4j.appender.rolling.rollingPolicy.MaxIndex=3
log4j.appender.rolling.triggeringPolicy=org.apache.log4cxx.rolling.SizeBasedTriggeringPolicy
log4j.appender.rolling.triggeringPolicy.MaxFileSize=1024
